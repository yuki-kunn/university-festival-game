<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <radialGradient id="glow5" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#a68cf0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a68cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorFade5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f08cc0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f08cc0" stop-opacity="0"/>
    </linearGradient>
    <filter id="noise5" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="320" fill="#0a0912"/>
  <ellipse cx="450" cy="140" rx="400" ry="140" fill="url(#glow5)"/>

  <!-- 鏡の水平線 -->
  <line x1="140" y1="168" x2="760" y2="168" stroke="#4a3f66" stroke-width="1" opacity="0.6"/>

  <!-- 本体：一文字目だけノイズで欠けさせる -->
  <g filter="url(#noise5)" opacity="0.6">
    <text x="205" y="150" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="100"
          fill="#f5f3fa" text-anchor="middle">不</text>
  </g>
  <text x="450" y="150" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="100"
        fill="#f5f3fa" letter-spacing="20" text-anchor="middle">　在証明</text>

  <!-- 鏡像：全体反転、ピンク寄りの異物感 -->
  <g transform="translate(0,336) scale(1,-1)" opacity="0.32">
    <text x="450" y="150" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="100"
          fill="#f08cc0" letter-spacing="20" text-anchor="middle">不在証明</text>
  </g>
  <rect x="0" y="168" width="900" height="152" fill="url(#mirrorFade5)" opacity="0.6"/>

  <text x="450" y="285" font-family="sans-serif" font-size="19" letter-spacing="6"
        fill="#d4cfe0" text-anchor="middle" opacity="0.85">ALIBI &#8212; UNIVERSITY FESTIVAL GAME</text>
</svg>
