<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <!-- 「明」の最終画（右側の「月」の一部）だけを透明化するグラデーション -->
    <linearGradient id="fadeOut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="60%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="lastCharMask">
      <rect x="0" y="0" width="800" height="220" fill="url(#fadeOut)"/>
    </mask>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#7c5fd4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5fd4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="220" fill="#0e0c13"/>
  <ellipse cx="400" cy="105" rx="360" ry="110" fill="url(#bgGlow)"/>

  <!-- 本体：しっかりした骨格を保つ -->
  <text x="400" y="130" font-family="'Hiragino Mincho ProN','Yu Mincho',serif"
        font-size="92" font-weight="600" fill="#f5f3fa" letter-spacing="14"
        text-anchor="middle">不在証</text>

  <!-- 最後の一文字「明」だけ、右端に向かって静かに透明化 -->
  <g mask="url(#lastCharMask)">
    <text x="686" y="130" font-family="'Hiragino Mincho ProN','Yu Mincho',serif"
          font-size="92" font-weight="600" fill="#f5f3fa" text-anchor="middle">明</text>
  </g>

  <line x1="270" y1="160" x2="530" y2="160" stroke="#7c5fd4" stroke-width="1" opacity="0.5"/>

  <text x="400" y="195" font-family="sans-serif" font-size="15" letter-spacing="7"
        fill="#a89fc0" text-anchor="middle">ALIBI</text>
</svg>
