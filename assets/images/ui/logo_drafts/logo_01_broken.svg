<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a68cf0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a68cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="55%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="charFadeMask">
      <rect x="0" y="0" width="900" height="260" fill="url(#fadeMask)"/>
    </mask>
    <filter id="noise1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="260" fill="#0e0c13"/>
  <ellipse cx="450" cy="130" rx="420" ry="140" fill="url(#glow1)"/>

  <!-- 通常の3文字 -->
  <text x="230" y="165" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="120"
        fill="#f5f3fa" letter-spacing="18" text-anchor="middle">在証</text>

  <!-- 崩れる最初の文字「不」 -->
  <g filter="url(#noise1)">
    <text x="90" y="165" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="120"
          fill="#f5f3fa" text-anchor="middle" opacity="0.55">不</text>
  </g>

  <!-- 消えかける最後の文字「明」 -->
  <g mask="url(#charFadeMask)">
    <text x="690" y="165" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="120"
          fill="#f5f3fa" text-anchor="middle">明</text>
  </g>

  <!-- ノイズの粒子（欠落の演出） -->
  <g fill="#a68cf0" opacity="0.7">
    <circle cx="120" cy="70" r="2"/>
    <circle cx="145" cy="95" r="1.5"/>
    <circle cx="60" cy="140" r="1.8"/>
    <circle cx="770" cy="80" r="2"/>
    <circle cx="810" cy="130" r="1.5"/>
    <circle cx="750" cy="190" r="1.6"/>
    <circle cx="820" cy="170" r="1.2"/>
  </g>

  <text x="450" y="225" font-family="sans-serif" font-size="20" letter-spacing="6"
        fill="#d4cfe0" text-anchor="middle" opacity="0.85">ALIBI &#8212; UNIVERSITY FESTIVAL GAME</text>
</svg>
