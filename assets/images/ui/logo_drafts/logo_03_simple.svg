<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <radialGradient id="glow3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a68cf0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a68cf0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="240" fill="#0e0c13"/>
  <ellipse cx="450" cy="115" rx="380" ry="120" fill="url(#glow3)"/>

  <text x="450" y="150" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="108"
        fill="#f5f3fa" letter-spacing="22" text-anchor="middle" filter="url(#softGlow)">不在証明</text>

  <line x1="330" y1="185" x2="570" y2="185" stroke="#a68cf0" stroke-width="1" opacity="0.5"/>

  <text x="450" y="215" font-family="sans-serif" font-size="18" letter-spacing="6"
        fill="#d4cfe0" text-anchor="middle" opacity="0.85">ALIBI &#8212; UNIVERSITY FESTIVAL GAME</text>
</svg>
