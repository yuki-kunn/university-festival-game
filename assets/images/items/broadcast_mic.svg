<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="micGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#3a3448" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14121a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2733"/>
      <stop offset="35%" stop-color="#514c60"/>
      <stop offset="55%" stop-color="#6b6478"/>
      <stop offset="75%" stop-color="#403c4d"/>
      <stop offset="100%" stop-color="#1e1c26"/>
    </linearGradient>
    <linearGradient id="meshBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1a22"/>
      <stop offset="30%" stop-color="#3d3a48"/>
      <stop offset="50%" stop-color="#4c4858"/>
      <stop offset="70%" stop-color="#302d38"/>
      <stop offset="100%" stop-color="#141219"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1820"/>
      <stop offset="50%" stop-color="#3a3644"/>
      <stop offset="100%" stop-color="#141219"/>
    </linearGradient>
    <pattern id="meshPattern" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.6" fill="none" stroke="#0a0910" stroke-width="0.8" opacity="0.65"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="#0e0c13"/>
  <ellipse cx="200" cy="150" rx="160" ry="160" fill="url(#micGlow)"/>

  <!-- スタンド -->
  <path d="M 200 400 L 200 300" stroke="url(#standGrad)" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="200" cy="398" rx="70" ry="10" fill="#0a0910" opacity="0.6"/>
  <path d="M 130 395 Q 200 415 270 395 L 260 385 Q 200 400 140 385 Z" fill="url(#standGrad)"/>

  <!-- マイクホルダー -->
  <path d="M 175 300 Q 175 275 200 275 Q 225 275 225 300" fill="none" stroke="#3a3644" stroke-width="10" stroke-linecap="round"/>

  <!-- マイク本体：グリル（網状の球） -->
  <ellipse cx="200" cy="200" rx="58" ry="72" fill="url(#meshBody)"/>
  <ellipse cx="200" cy="200" rx="58" ry="72" fill="url(#meshPattern)" opacity="0.7"/>
  <ellipse cx="200" cy="200" rx="58" ry="72" fill="none" stroke="#0a0910" stroke-width="2" opacity="0.6"/>

  <!-- グリルのハイライト -->
  <ellipse cx="182" cy="175" rx="16" ry="30" fill="#7a7488" opacity="0.35"/>

  <!-- マイクの首元（金属パーツ） -->
  <rect x="178" y="255" width="44" height="30" rx="6" fill="url(#metalBody)"/>
  <line x1="178" y1="265" x2="222" y2="265" stroke="#1a1820" stroke-width="1.5" opacity="0.6"/>
  <line x1="178" y1="275" x2="222" y2="275" stroke="#1a1820" stroke-width="1.5" opacity="0.6"/>

  <!-- ケーブル -->
  <path d="M 200 285 Q 160 320 190 360 Q 220 395 170 400" fill="none" stroke="#141219" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- 埃・経年劣化の表現：小さな傷、くすみ -->
  <g opacity="0.4">
    <line x1="210" y1="180" x2="225" y2="195" stroke="#0a0910" stroke-width="1.5"/>
    <line x1="185" y1="220" x2="195" y2="235" stroke="#0a0910" stroke-width="1"/>
    <circle cx="215" cy="230" r="2" fill="#0a0910"/>
    <circle cx="190" cy="190" r="1.5" fill="#0a0910"/>
  </g>

  <!-- 台座のプレート（型番等が刻まれているイメージ） -->
  <rect x="160" y="340" width="80" height="18" rx="3" fill="#1a1820" opacity="0.7"/>
  <text x="200" y="353" font-family="monospace" font-size="9" fill="#6b6478" text-anchor="middle" letter-spacing="1">BROADCAST MIC-7</text>
</svg>
