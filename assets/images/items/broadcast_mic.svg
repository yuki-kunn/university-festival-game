<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="micGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#3a3448" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14121a" stop-opacity="0"/>
    </radialGradient>

    <!-- 円筒ボディの金属グラデーション（左からハイライト→影→ハイライト） -->
    <linearGradient id="cylinderBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1a24"/>
      <stop offset="18%" stop-color="#4a4558"/>
      <stop offset="38%" stop-color="#7a7488"/>
      <stop offset="50%" stop-color="#8f889c"/>
      <stop offset="62%" stop-color="#6b6478"/>
      <stop offset="82%" stop-color="#3a3648"/>
      <stop offset="100%" stop-color="#16141c"/>
    </linearGradient>

    <!-- メッシュヘッドの金属グラデーション -->
    <linearGradient id="meshHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141219"/>
      <stop offset="20%" stop-color="#3a3644"/>
      <stop offset="45%" stop-color="#575265"/>
      <stop offset="55%" stop-color="#575265"/>
      <stop offset="80%" stop-color="#2e2b38"/>
      <stop offset="100%" stop-color="#0e0d13"/>
    </linearGradient>

    <linearGradient id="standGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141219"/>
      <stop offset="45%" stop-color="#4a4558"/>
      <stop offset="55%" stop-color="#4a4558"/>
      <stop offset="100%" stop-color="#0e0d13"/>
    </linearGradient>

    <radialGradient id="meshDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0910"/>
      <stop offset="100%" stop-color="#0a0910" stop-opacity="0"/>
    </radialGradient>
    <pattern id="meshPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <circle cx="4" cy="4" r="1.7" fill="#0a0910" opacity="0.55"/>
    </pattern>
    <clipPath id="headClip">
      <path d="M 148 122 Q 148 96 200 96 Q 252 96 252 122 L 252 205 Q 252 226 200 226 Q 148 226 148 205 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="#0e0c13"/>
  <ellipse cx="200" cy="160" rx="170" ry="170" fill="url(#micGlow)"/>

  <!-- 台座（デスクスタンド） -->
  <ellipse cx="200" cy="360" rx="66" ry="12" fill="#0a0910" opacity="0.7"/>
  <path d="M 148 358 Q 200 372 252 358 L 246 342 Q 200 356 154 342 Z" fill="url(#standGrad)"/>
  <rect x="188" y="300" width="24" height="46" rx="4" fill="url(#standGrad)"/>

  <!-- スタンドのアーム（マイクを支える金属バンド） -->
  <path d="M 165 300 Q 165 268 200 266 Q 235 268 235 300" fill="none" stroke="url(#standGrad)" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="200" cy="270" rx="14" ry="5" fill="#0a0910" opacity="0.5"/>

  <!-- マイク本体：円筒形ボディ -->
  <rect x="160" y="220" width="80" height="70" rx="10" fill="url(#cylinderBody)"/>
  <rect x="160" y="220" width="80" height="70" rx="10" fill="none" stroke="#0a0910" stroke-width="1.5" opacity="0.6"/>
  <!-- ボディの横リブ（segment lines） -->
  <line x1="160" y1="238" x2="240" y2="238" stroke="#0a0910" stroke-width="1.2" opacity="0.5"/>
  <line x1="160" y1="256" x2="240" y2="256" stroke="#0a0910" stroke-width="1.2" opacity="0.5"/>
  <line x1="160" y1="274" x2="240" y2="274" stroke="#0a0910" stroke-width="1.2" opacity="0.5"/>

  <!-- ロゴプレート（型番） -->
  <rect x="176" y="244" width="48" height="14" rx="2" fill="#0e0d13" opacity="0.8"/>
  <text x="200" y="254" font-family="monospace" font-size="7.5" fill="#9b93ac" text-anchor="middle" letter-spacing="0.5">MIC-7</text>

  <!-- 首の絞り（ボディとヘッドの接続部） -->
  <path d="M 168 220 Q 168 205 178 200 L 222 200 Q 232 205 232 220 Z" fill="url(#cylinderBody)"/>

  <!-- マイクヘッド：メッシュの半球〜円筒（グリルボール） -->
  <path d="M 148 122 Q 148 96 200 96 Q 252 96 252 122 L 252 205 Q 252 226 200 226 Q 148 226 148 205 Z"
        fill="url(#meshHead)" stroke="#0a0910" stroke-width="2"/>
  <g clip-path="url(#headClip)">
    <rect x="140" y="90" width="120" height="145" fill="url(#meshPattern)" opacity="0.85"/>
    <!-- ハイライト（左上に丸い光沢） -->
    <ellipse cx="178" cy="130" rx="18" ry="34" fill="#c8c2d8" opacity="0.25"/>
    <ellipse cx="222" cy="180" rx="14" ry="22" fill="#0a0910" opacity="0.25"/>
  </g>

  <!-- ヘッドの上部・下部の金属リング -->
  <ellipse cx="200" cy="122" rx="52" ry="10" fill="none" stroke="#8f889c" stroke-width="2.5" opacity="0.7"/>
  <ellipse cx="200" cy="205" rx="52" ry="10" fill="none" stroke="#3a3648" stroke-width="2.5" opacity="0.7"/>

  <!-- 先端の小さな飾りキャップ -->
  <ellipse cx="200" cy="98" rx="10" ry="5" fill="#7a7488" opacity="0.8"/>

  <!-- ケーブル -->
  <path d="M 200 290 Q 155 320 185 350 Q 215 375 165 392" fill="none" stroke="#141219" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- 経年劣化：くすみ・小傷 -->
  <g opacity="0.35">
    <line x1="222" y1="150" x2="234" y2="165" stroke="#0a0910" stroke-width="1.4"/>
    <line x1="168" y1="240" x2="178" y2="250" stroke="#0a0910" stroke-width="1"/>
    <circle cx="230" cy="270" r="1.8" fill="#0a0910"/>
  </g>
</svg>
