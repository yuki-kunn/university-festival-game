<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不在証明</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- タイトル画面 -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <h1 class="game-logo" aria-label="不在証明">
        <span class="game-logo-ghost cyan" aria-hidden="true">不在証明</span>
        <span class="game-logo-ghost magenta" aria-hidden="true">不在証明</span>
        <span class="game-logo-main">不在証明</span>
      </h1>
      <div class="game-logo-divider"></div>
      <p class="game-subtitle">ALIBI &#8212; University Festival Game (RPG Part)</p>
      <button id="btn-start" class="btn-primary">はじめる</button>
    </div>
  </section>

  <!-- 名前入力画面 -->
  <section id="screen-name-input" class="screen">
    <div class="name-input-wrap">
      <p class="name-input-label">あなたの名前を教えてください</p>
      <input type="text" id="input-player-name" class="name-input-field" maxlength="12" placeholder="例：栗川　悠人" autocomplete="off">
      <p class="name-input-hint">未入力のまま進むと「＜主人公＞」と表記されます</p>
      <button id="btn-name-confirm" class="btn-primary">この名前で始める</button>
    </div>
  </section>

  <!-- ゲーム画面（ノベルパート） -->
  <section id="screen-novel" class="screen">
    <div class="bg-layer" id="bg-layer"></div>

    <div class="char-layer" id="char-layer">
      <img id="char-sprite" class="char-sprite" src="" alt="" hidden>
    </div>

    <div class="textbox" id="textbox">
      <div class="speaker-name" id="speaker-name"></div>
      <div class="line-text" id="line-text"></div>
      <div class="next-indicator" id="next-indicator">▼</div>
    </div>

    <div class="choice-layer" id="choice-layer" hidden>
      <div class="choice-prompt" id="choice-prompt"></div>
      <div class="choice-list" id="choice-list"></div>
    </div>

    <div class="item-viewer" id="item-viewer" hidden>
      <div class="item-viewer-frame">
        <div class="item-viewer-caption" id="item-viewer-caption"></div>
        <div class="item-viewer-image" id="item-viewer-image"></div>
        <button id="btn-item-close" class="btn-secondary">閉じる</button>
      </div>
    </div>
  </section>

  <!-- 未実装ルート案内画面 -->
  <section id="screen-notyet" class="screen">
    <div class="notyet-wrap">
      <p id="notyet-message">このルートは現在製作中です。</p>
      <button id="btn-back-title" class="btn-primary">タイトルへ戻る</button>
    </div>
  </section>

  <!-- 推理クイズ画面 -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-wrap">
      <div class="quiz-header">
        <h2 class="quiz-title" id="quiz-title"></h2>
        <p class="quiz-prompt" id="quiz-prompt"></p>
      </div>

      <!-- 矛盾指摘型：カードを2枚選ぶ -->
      <div class="quiz-cards quiz-cards--contradiction" id="quiz-cards-contradiction" hidden></div>

      <!-- 時系列並べ替え型：クリックした順に並べる -->
      <div class="quiz-timeline" id="quiz-timeline" hidden>
        <div class="quiz-timeline-slots" id="quiz-timeline-slots"></div>
        <div class="quiz-cards quiz-cards--timeline" id="quiz-cards-timeline"></div>
        <button id="btn-timeline-reset" class="btn-secondary">選び直す</button>
      </div>

      <button id="btn-quiz-submit" class="btn-primary" hidden>これで確定する</button>

      <div class="quiz-result" id="quiz-result" hidden>
        <p class="quiz-result-verdict" id="quiz-result-verdict"></p>
        <p class="quiz-result-explain" id="quiz-result-explain"></p>
        <button id="btn-quiz-next" class="btn-primary">次へ</button>
      </div>
    </div>
  </section>

  <!-- エンド画面 -->
  <section id="screen-end" class="screen">
    <div class="end-wrap">
      <p id="end-message"></p>
      <button id="btn-restart" class="btn-primary">タイトルへ戻る</button>
    </div>
  </section>

  <script src="assets/js/asset-api-config.js"></script>
  <script src="assets/js/asset-cache.js"></script>
  <script src="assets/js/engine.js"></script>
</body>
</html>
