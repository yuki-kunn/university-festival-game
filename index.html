<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不在証明</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- タイトル画面 -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <h1 class="game-logo" aria-label="不在証明">
        <span class="game-logo-ghost cyan" aria-hidden="true">不在証明</span>
        <span class="game-logo-ghost magenta" aria-hidden="true">不在証明</span>
        <span class="game-logo-main">不在証明</span>
      </h1>
      <div class="game-logo-divider"></div>
      <p class="game-subtitle">ALIBI &#8212; University Festival Game (RPG Part)</p>
      <button id="btn-start" class="btn-primary">はじめる</button>
    </div>
  </section>

  <!-- ゲーム画面（ノベルパート） -->
  <section id="screen-novel" class="screen">
    <div class="bg-layer" id="bg-layer"></div>

    <div class="char-layer" id="char-layer">
      <img id="char-sprite" class="char-sprite" src="" alt="" hidden>
    </div>

    <div class="textbox" id="textbox">
      <div class="speaker-name" id="speaker-name"></div>
      <div class="line-text" id="line-text"></div>
      <div class="next-indicator" id="next-indicator">▼</div>
    </div>

    <div class="choice-layer" id="choice-layer" hidden>
      <div class="choice-prompt" id="choice-prompt"></div>
      <div class="choice-list" id="choice-list"></div>
    </div>
  </section>

  <!-- 未実装ルート案内画面 -->
  <section id="screen-notyet" class="screen">
    <div class="notyet-wrap">
      <p id="notyet-message">このルートは現在製作中です。</p>
      <button id="btn-back-title" class="btn-primary">タイトルへ戻る</button>
    </div>
  </section>

  <!-- エンド画面 -->
  <section id="screen-end" class="screen">
    <div class="end-wrap">
      <p id="end-message"></p>
      <button id="btn-restart" class="btn-primary">タイトルへ戻る</button>
    </div>
  </section>

  <script src="assets/js/engine.js"></script>
</body>
</html>
